<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現場進捗 MASTER v0.9.5</title>
<style>
:root{--bg:#f3f4f6;--ink:#111827;--mut:#6b7280;--line:#d1d5db;--navy:#101828;--未:#f8fafc;--中:#fff3b0;--完:#dcfce7;--残:#fed7aa;--手:#fecaca;--確:#bfdbfe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{position:sticky;top:0;z-index:5;background:#101828;color:white;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #0002}.logo{width:48px;height:48px;border-radius:12px;object-fit:cover}h1{font-size:19px;margin:0}.ver{font-size:12px;color:#cbd5e1}.wrap{max-width:1380px;margin:auto;padding:12px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 4px #0001}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:16px 0 8px}.settingsBox{margin-top:12px}.settingsBox summary{list-style:none;cursor:pointer;background:#111827;color:white;border-radius:12px;padding:11px 13px;font-weight:950;display:flex;justify-content:space-between;align-items:center}.settingsBox summary::-webkit-details-marker{display:none}.settingsBox summary:after{content:'開く';font-size:12px;background:#fff2;color:white;border:1px solid #fff4;border-radius:999px;padding:3px 8px}.settingsBox[open] summary:after{content:'閉じる'}.settingsInner{border:1px solid var(--line);border-radius:0 0 14px 14px;border-top:0;padding:12px;background:#fafafa}.muted{color:var(--mut);font-size:13px}label{display:block;color:var(--mut);font-size:12px;margin:6px 0 4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:white}textarea{min-height:74px}button{border:0;border-radius:10px;padding:10px 12px;background:#111827;color:white;font-weight:800;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.danger{background:#b91c1c}.small{padding:7px 9px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:95px}.project{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:white;cursor:pointer}.project.active{outline:3px solid #111827}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff}.stat b{display:block;font-size:20px}.progress{height:14px;border-radius:99px;background:#e5e7eb;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:#111827}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:#e5e7eb;color:#111827}.tabs button.active{background:#111827;color:white}.legend{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #0001;border-radius:999px;padding:5px 8px;font-weight:800;font-size:12px}.未施工{background:var(--未)}.施工中{background:var(--中)}.完了{background:var(--完)}.残作業あり{background:var(--残)}.手直しあり{background:var(--手)}.完了確認済み{background:var(--確)}
.buildingWrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:white;padding:10px;max-height:72vh}.building{min-width:1050px}.floorLine{display:grid;grid-template-columns:56px 1fr;border-bottom:2px solid #222}.floorLine:first-child{border-top:2px solid #222}.floorLabel{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:950;border-right:2px solid #222;background:#f8fafc}.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.unit{min-height:126px;border-right:2px solid #222;display:grid;grid-template-rows:38px 48px 40px;position:relative;cursor:pointer}.unit:hover{outline:3px solid #0004;z-index:2}.unitTop,.unitMid{display:grid;grid-template-columns:1fr 1fr}.cell{border-left:1px solid #555;border-bottom:1px solid #555;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:950;overflow:hidden;padding:2px}.cell:first-child{border-left:0}.roomNo{font-size:20px}.roomType,.roomSize,.roomDir{font-size:23px;letter-spacing:.02em}.memo{display:flex;align-items:center;padding:5px 8px;font-size:14px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.stripe{position:absolute;left:0;top:0;bottom:0;width:8px}.statusTxt{position:absolute;right:4px;bottom:3px;background:#fffddd;border:1px solid #0001;border-radius:999px;font-size:10px;padding:1px 5px}.dot{position:absolute;right:5px;top:5px;width:9px;height:9px;background:#111;border-radius:50%}.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.miniRoom{border:2px solid #0002;border-radius:12px;padding:9px;min-height:80px;cursor:pointer}.miniRoom b{font-size:18px}.miniRoom div{font-weight:900}.tableWrap{overflow:auto}.roomTable{width:100%;border-collapse:separate;border-spacing:0 7px;min-width:780px}.roomTable th{text-align:left;font-size:12px;color:#6b7280}.roomTable td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}.roomTable td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px;font-weight:900}.roomTable td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}.modalBg{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:12px}.modal{background:white;border-radius:18px;padding:16px;max-width:540px;width:100%;max-height:92vh;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quick button{color:#111827;border:1px solid #0001}.importLabel{display:inline-block;background:#e5e7eb;color:#111827;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:800;cursor:pointer}.accordion{margin:10px 0}.accordion summary{list-style:none;cursor:pointer;background:#111827;color:white;border-radius:12px;padding:11px 13px;font-weight:950;display:flex;justify-content:space-between;align-items:center}.accordion summary::-webkit-details-marker{display:none}.accordion summary:after{content:'開く';font-size:12px;background:#fff2;color:white;border:1px solid #fff4;border-radius:999px;padding:3px 8px}.accordion[open] summary:after{content:'閉じる'}.accordionInner{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:#fafafa;padding:12px}.mapMain{margin-top:10px}.floating{position:fixed;right:18px;bottom:18px;z-index:10}.fab{width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;box-shadow:0 8px 20px #0004}.fabMenu{display:none;position:absolute;right:0;bottom:70px;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 20px #0003;overflow:hidden;min-width:180px}.fabMenu button{display:block;width:100%;border-radius:0;background:white;color:#111827;text-align:left;border-bottom:1px solid var(--line)}.fabMenu.open{display:block}.filterRow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.topTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.zoomBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0}.zoomBar button{background:#e5e7eb;color:#111827}.zoomBar input[type=range]{width:170px}.zoomPct{font-weight:950;min-width:54px;text-align:center}.viewport{height:65vh;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:white;min-height:420px;touch-action:none}.panStage{transform-origin:0 0;will-change:transform;display:inline-block;padding:10px;cursor:grab}.panStage.dragging{cursor:grabbing}.viewport.fullscreenMap{position:fixed;inset:0;z-index:50;border-radius:0;min-height:100vh;background:#f8fafc}.fullscreenMap .panStage{padding:16px}.minimap{position:absolute;right:10px;bottom:10px;width:132px;height:92px;background:#ffffffe8;border:2px solid #111827;border-radius:10px;padding:6px;box-shadow:0 6px 18px #0003;display:grid;gap:2px;pointer-events:none}.miniFloor{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}.miniCell{border-radius:2px;border:1px solid #0002}.rotate90{transform-origin:center center}.fitHint{font-size:12px;color:#6b7280}.mapControlsTop{position:absolute;left:10px;top:10px;z-index:2;background:#ffffffdf;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;pointer-events:none}.buildingWrap{max-height:none;overflow:visible;border:0;padding:0;background:transparent}.map,.tableWrap{min-width:680px}.mapFullClose{display:none;position:fixed;top:12px;right:12px;z-index:60}.mapFullClose.show{display:block}

@media(max-width:850px){.layout{grid-template-columns:1fr}.viewport{height:68vh}.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.logo{width:42px;height:42px}.wrap{padding:8px}.building{min-width:980px}.card{border-radius:13px}.stats .stat:last-child{grid-column:auto}.roomType,.roomSize,.roomDir{font-size:22px}}
</style></head><body>
<header><img class="logo" src="a_clean_vector_like_app_icon_logo_overall_scene.png" onerror="this.style.display='none'"><div><h1>現場進捗 MASTER <span class="ver">Ver.0.9.5 現場テスト版</span></h1><div class="ver">住戸マップ中心・担当者・施工日・バックアップ</div></div></header>
<div class="wrap"><div class="layout"><section class="card"><details class="settingsBox"><summary>案件一覧・データ管理</summary><div class="settingsInner"><h2>案件一覧</h2><label>案件名</label><input id="projectName" placeholder="例：〇〇マンション新築工事"><button style="width:100%;margin-top:8px" onclick="addProject()">案件を追加</button><div id="projectList"></div><h3>バックアップ</h3><button class="secondary small" onclick="exportData()">出力</button> <label class="importLabel">読込<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label><p class="muted">※今はスマホ・PC本体保存。Google共有は未対応。端末ごとに別データです。定期的にバックアップを保存してください。</p></div></details></section><main id="main" class="card"><p class="muted">案件を追加して始めてね。</p></main></div></div>
<div id="modalBg" class="modalBg" onclick="if(event.target.id==='modalBg')closeModal()"><div id="modal" class="modal"></div></div>
<script>
const LS='genbaProgressMaster08'; const statuses=['未施工','施工中','完了','残作業あり','手直しあり','完了確認済み']; let data;try{data=JSON.parse(localStorage.getItem(LS)||'{"projects":[],"current":null,"view":"building"}')}catch{data={projects:[],current:null,view:"building"}};
const save=()=>{localStorage.setItem(LS,JSON.stringify(data));render()}; const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7); const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const cur=()=>data.projects.find(p=>p.id===data.current);
function addProject(){let name=document.getElementById('projectName').value.trim(); if(!name)return alert('案件名を入力してね'); let p={id:uid(),name,client:'',manager:'',rooms:[],created:new Date().toLocaleDateString()};data.projects.push(p);data.current=p.id;document.getElementById('projectName').value='';save()}
function render(){renderProjects(); let p=cur(); if(!p){main.innerHTML='<p class="muted">案件を追加して始めてね。</p>';return} renderMain(p)}
function renderProjects(){projectList.innerHTML=data.projects.map(p=>`<div class="project ${p.id===data.current?'active':''}" onclick="data.current='${p.id}';save()"><b>${esc(p.name)}</b><div class="muted">${p.rooms.length}室 / ${p.created||''}</div></div>`).join('')||'<p class="muted">未登録</p>'}
function stats(p){let total=p.rooms.length,done=p.rooms.filter(r=>r.status==='完了'||r.status==='完了確認済み').length,check=p.rooms.filter(r=>r.status==='完了確認済み').length,issue=p.rooms.filter(r=>r.status==='残作業あり'||r.status==='手直しあり').length,mid=p.rooms.filter(r=>r.status==='施工中').length;return{total,done,check,issue,mid,remain:total-done,rate:total?Math.round(done/total*100):0}}
function renderMain(p){let st=stats(p); main.innerHTML=`<div class="topTitle"><div><h2>${esc(p.name)}</h2><div class="muted">住戸マップをメインに使える開閉式画面</div></div><button class="danger small" onclick="deleteProject()">案件削除</button></div>
<details class="accordion" ${data.openInfo?'open':''} ontoggle="data.openInfo=this.open;localStorage.setItem(LS,JSON.stringify(data))"><summary>案件情報・部屋作成</summary><div class="accordionInner"><h3>案件情報</h3><div class="row"><div><label>施工会社</label><input id="client" value="${esc(p.client||'')}" oninput="cur().client=this.value;localStorage.setItem(LS,JSON.stringify(data))"></div><div><label>担当者</label><input id="manager" value="${esc(p.manager||'')}" oninput="cur().manager=this.value;localStorage.setItem(LS,JSON.stringify(data))"></div></div><h3>部屋をまとめて自動生成</h3><div class="row"><div><label>開始階</label><input id="sf" type="number" value="1"></div><div><label>終了階</label><input id="ef" type="number" value="10"></div><div><label>各階 開始号室</label><input id="sr" type="number" value="1"></div><div><label>各階 終了号室</label><input id="er" type="number" value="8"></div><div><label>住戸タイプ</label><input id="defType" placeholder="例：A"></div><div><label>UBサイズ</label><input id="defSize" placeholder="例：1216"></div><div><label>勝手</label><input id="defDir" placeholder="例：BR"></div></div><button style="margin-top:8px" onclick="autoCreate()">部屋を自動生成</button><h3>部屋を1件追加</h3><div class="row"><div><label>階</label><input id="floor" placeholder="1"></div><div><label>部屋番号</label><input id="roomNo" placeholder="101"></div><div><label>住戸タイプ</label><input id="roomType" placeholder="A"></div><div><label>UBサイズ</label><input id="roomSize" placeholder="1216"></div><div><label>勝手</label><input id="roomDir" placeholder="BR"></div><div><label>状態</label><select id="roomStatus">${statuses.map(s=>`<option>${s}</option>`).join('')}</select></div></div><label>メモ</label><textarea id="roomMemo" placeholder="残作業・手直し内容など"></textarea><button onclick="addRoom()">部屋を追加</button></div></details>
<details class="accordion" ${data.openStats?'open':''} ontoggle="data.openStats=this.open;localStorage.setItem(LS,JSON.stringify(data))"><summary>進捗状況</summary><div class="accordionInner"><div class="stats"><div class="stat"><b>${st.total}</b><span>全室</span></div><div class="stat"><b>${st.done}</b><span>完了</span></div><div class="stat"><b>${st.mid}</b><span>施工中</span></div><div class="stat"><b>${st.issue}</b><span>残/手直し</span></div><div class="stat"><b>${st.remain}</b><span>未完了</span></div><div class="stat"><b>${st.rate}%</b><span>進捗率</span></div></div><div class="progress"><div class="bar" style="width:${st.rate}%"></div></div><div class="legend">${statuses.map(s=>`<span class="chip ${s}">${s}</span>`).join('')}</div></div></details>
<details class="accordion" ${data.openSearch?'open':''} ontoggle="data.openSearch=this.open;localStorage.setItem(LS,JSON.stringify(data))"><summary>検索・フィルター</summary><div class="accordionInner"><div class="filterRow"><div><label>検索（部屋/タイプ/UB/勝手/担当/メモ）</label><input id="q" value="${esc(data.q||'')}" placeholder="例：405、A、1216、AL" oninput="data.q=this.value;save()"></div><div><label>状態</label><select id="filterStatus" onchange="data.filterStatus=this.value;save()"><option value="">全部</option>${statuses.map(x=>`<option ${data.filterStatus===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>階</label><input value="${esc(data.filterFloor||'')}" placeholder="例：4" oninput="data.filterFloor=this.value;save()"></div><div><label>表示</label><select onchange="data.view=this.value;save()"><option value="building" ${data.view==='building'?'selected':''}>住戸図</option><option value="map" ${data.view==='map'?'selected':''}>カード</option><option value="table" ${data.view==='table'?'selected':''}>一覧表</option></select></div></div><div class="tabs"><button onclick="data.filterStatus='';data.filterFloor='';data.q='';save()">絞り込み解除</button>${statuses.map(x=>`<button class="${data.filterStatus===x?'active':''}" onclick="data.filterStatus='${x}';save()">${x}</button>`).join('')}</div></div></details>
<section class="mapMain"><div class="toolbar"><h3>住戸マップ（表示切替）</h3><div class="tabs"><button class="${data.view==='building'?'active':''}" onclick="data.view='building';save()">住戸図</button><button class="${data.view==='map'?'active':''}" onclick="data.view='map';save()">カード</button><button class="${data.view==='table'?'active':''}" onclick="data.view='table';save()">一覧表</button></div></div><div class="zoomBar"><button class="small" onclick="zoomBy(-0.1)">−</button><input id="zoomSlider" type="range" min="50" max="300" value="${Math.round((data.zoom||1)*100)}" oninput="setZoom(this.value/100)"><button class="small" onclick="zoomBy(0.1)">＋</button><span class="zoomPct">${Math.round((data.zoom||1)*100)}%</span><button class="small secondary" onclick="fitMap()">自動フィット</button><button class="small secondary" onclick="toggleFullMap()">全画面</button><button class="small secondary" onclick="rotateMap()">回転</button><span class="fitHint">ドラッグ移動 / ホイール・ピンチで拡大縮小</span></div><button id="mapFullClose" class="mapFullClose secondary" onclick="toggleFullMap(false)">全画面を閉じる</button>${renderRooms(p)}</section>
<div class="floating"><div id="fabMenu" class="fabMenu"><button onclick="data.openInfo=true;save();toggleFab(false)">＋ 部屋追加・自動生成</button><button onclick="data.openSearch=true;save();toggleFab(false)">🔍 検索・フィルター</button><button onclick="data.openStats=true;save();toggleFab(false)">📊 進捗状況</button><button onclick="exportData()">📤 バックアップ出力</button></div><button class="fab" onclick="toggleFab()">＋</button></div>`} 
function filteredRooms(p){let q=(data.q||'').toLowerCase().trim();return p.rooms.filter(r=>(!data.filterStatus||r.status===data.filterStatus)&&(!data.filterFloor||String(r.floor)===String(data.filterFloor))&&(!q||[r.no,r.floor,r.type,r.size,r.dir,r.status,r.memo,r.worker].some(v=>String(v||'').toLowerCase().includes(q))))}
function renderRooms(p){let rooms=filteredRooms(p); if(!p.rooms.length)return '<p class="muted">まだ部屋がありません。</p>'; if(!rooms.length)return '<p class="muted">条件に合う部屋がありません。</p>'; let floors=[...new Set(rooms.map(r=>r.floor))].sort((a,b)=>Number(b)-Number(a)); if(data.view==='table')return `<div class="viewport" id="mapViewport"><div class="mapControlsTop">一覧表</div><div class="panStage" id="panStage"><div class="tableWrap"><table class="roomTable"><tr><th>部屋</th><th>階</th><th>タイプ</th><th>UB</th><th>勝手</th><th>状態</th><th>メモ</th></tr>${rooms.slice().sort(sortRoom).map(r=>`<tr onclick="openRoom('${r.id}')"><td>${esc(r.no)}</td><td>${esc(r.floor)}F</td><td>${esc(r.type)}</td><td>${esc(r.size)}</td><td>${esc(r.dir)}</td><td><span class="chip ${r.status}">${r.status}</span></td><td>${esc(r.memo)}</td></tr>`).join('')}</table></div></div>${renderMinimap(rooms)}</div>`; if(data.view==='map')return `<div class="viewport" id="mapViewport"><div class="mapControlsTop">カード</div><div class="panStage" id="panStage">${floors.map(f=>`<h3>${f}F</h3><div class="map">${rooms.filter(r=>r.floor==f).sort(sortRoom).map(roomMini).join('')}</div>`).join('')}</div>${renderMinimap(rooms)}</div>`; return `<div class="viewport" id="mapViewport"><div class="mapControlsTop">住戸図</div><div class="panStage" id="panStage"><div class="buildingWrap"><div class="building">${floors.map(f=>`<div class="floorLine"><div class="floorLabel">${f}F</div><div class="units">${rooms.filter(r=>r.floor==f).sort(sortRoom).map(roomUnit).join('')}</div></div>`).join('')}</div></div></div>${renderMinimap(rooms)}</div>`}

function renderRoomTable(p){let rooms=p.rooms.slice().sort(sortRoom); if(!rooms.length)return '<p class="muted">まだ部屋がありません。</p>'; return `<div class="viewport" id="mapViewport"><div class="mapControlsTop">一覧表</div><div class="panStage" id="panStage"><div class="tableWrap"><table class="roomTable"><tr><th>部屋</th><th>階</th><th>タイプ</th><th>UB</th><th>勝手</th><th>状態</th><th>メモ</th></tr>${rooms.map(r=>`<tr onclick="openRoom('${r.id}')"><td>${esc(r.no)}</td><td>${esc(r.floor)}F</td><td>${esc(r.type)}</td><td>${esc(r.size)}</td><td>${esc(r.dir)}</td><td><span class="chip ${r.status}">${r.status}</span></td><td>${esc(r.memo)}</td></tr>`).join('')}</table></div>`}
function toggleFab(force){let m=document.getElementById('fabMenu'); if(!m)return; if(force===false)m.classList.remove('open'); else m.classList.toggle('open')}

function roomUnit(r){return `<div class="unit ${r.status}" onclick="openRoom('${r.id}')"><div class="stripe ${r.status}"></div>${r.memo?'<div class="dot"></div>':''}<div class="unitTop"><div class="cell roomNo">${esc(r.no)}</div><div class="cell roomType">${esc(r.type)}</div></div><div class="unitMid"><div class="cell roomSize">${esc(r.size)}</div><div class="cell roomDir">${esc(r.dir)}</div></div><div class="memo">${esc(r.memo||'')}</div><div class="statusTxt">${r.worker?esc(r.worker)+" · ":""}${r.status}</div></div>`}
function roomMini(r){return `<div class="miniRoom ${r.status}" onclick="openRoom('${r.id}')"><b>${esc(r.no)}</b><div>${esc(r.type)}</div><div>${esc(r.size)} / ${esc(r.dir)}</div><small>${r.status}</small></div>`}
function sortRoom(a,b){return (Number(b.floor)-Number(a.floor))||(String(a.no).localeCompare(String(b.no),'ja',{numeric:true}))}
function autoCreate(){let p=cur(), sf=+document.getElementById('sf').value, ef=+document.getElementById('ef').value, sr=+document.getElementById('sr').value, er=+document.getElementById('er').value, type=defType.value.trim(), size=defSize.value.trim(), dir=defDir.value.trim(); if(!sf||!ef||!sr||!er||sf>ef||sr>er||ef-sf>100||er-sr>100||((ef-sf+1)*(er-sr+1)>1500))return alert('階と号室の範囲を確認してね（最大1500室）'); let add=0; for(let f=sf;f<=ef;f++){for(let n=sr;n<=er;n++){let no=`${f}${String(n).padStart(2,'0')}`; if(p.rooms.some(r=>r.no===no))continue; p.rooms.push({id:uid(),floor:String(f),no,type,size,dir,status:'未施工',memo:''}); add++}} alert(add+'室追加したよ'); save()}
function addRoom(){let p=cur(), no=roomNo.value.trim(); if(!no)return alert('部屋番号を入力してね');if(p.rooms.some(r=>r.no===no))return alert('同じ部屋番号が登録済みだよ'); p.rooms.push({id:uid(),floor:floor.value.trim()||String(no).slice(0,-2)||'1',no,type:roomType.value.trim(),size:roomSize.value.trim(),dir:roomDir.value.trim(),status:roomStatus.value,memo:roomMemo.value.trim()}); save()}
function openRoom(id){let p=cur(),r=p.rooms.find(x=>x.id===id); modalBg.style.display='flex'; modal.innerHTML=`<div class="modalHead"><h2>${esc(r.no)}号室</h2><button class="secondary small" onclick="closeModal()">閉じる</button></div><div class="quick">${statuses.map(s=>`<button class="${s}" onclick="setStatus('${id}','${s}')">${s}</button>`).join('')}</div><div class="row"><div><label>階</label><input id="mFloor" value="${esc(r.floor)}"></div><div><label>部屋番号</label><input id="mNo" value="${esc(r.no)}"></div></div><div class="row"><div><label>住戸タイプ</label><input id="mType" value="${esc(r.type)}"></div><div><label>UBサイズ</label><input id="mSize" value="${esc(r.size)}"></div><div><label>勝手</label><input id="mDir" value="${esc(r.dir)}"></div></div><label>状態</label><select id="mStatus">${statuses.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><div class="row"><div><label>担当者</label><input id="mWorker" value="${esc(r.worker||'')}"></div><div><label>施工日</label><input type="date" id="mDate" value="${esc(r.workDate||'')}"></div></div><label>残作業・メモ</label><textarea id="mMemo">${esc(r.memo)}</textarea><div class="row" style="margin-top:10px"><button onclick="saveRoom('${id}')">保存</button><button class="danger" onclick="deleteRoom('${id}')">削除</button></div>`}
function closeModal(){modalBg.style.display='none'} function setStatus(id,s){let r=cur().rooms.find(x=>x.id===id);r.status=s;if((s==='完了'||s==='完了確認済み')&&!r.workDate)r.workDate=new Date().toLocaleDateString('sv-SE');save();openRoom(id)} function saveRoom(id){let r=cur().rooms.find(x=>x.id===id);if(cur().rooms.some(x=>x.id!==id&&x.no===mNo.value.trim()))return alert('同じ部屋番号が登録済みだよ');Object.assign(r,{floor:mFloor.value.trim(),no:mNo.value.trim(),type:mType.value.trim(),size:mSize.value.trim(),dir:mDir.value.trim(),status:mStatus.value,worker:mWorker.value.trim(),workDate:mDate.value,memo:mMemo.value.trim()});closeModal();save()} function deleteRoom(id){if(confirm('この部屋を削除する？')){cur().rooms=cur().rooms.filter(r=>r.id!==id);closeModal();save()}}
function deleteProject(){if(confirm('この案件を削除する？')){data.projects=data.projects.filter(p=>p.id!==data.current);data.current=data.projects[0]?.id||null;save()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='genba-progress-master-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)} function importData(e){let f=e.target.files[0];if(!f)return;let fr=new FileReader();fr.onload=()=>{try{const incoming=JSON.parse(fr.result);if(!incoming||!Array.isArray(incoming.projects)||!incoming.projects.every(p=>p&&typeof p.name==='string'&&Array.isArray(p.rooms)))throw Error('invalid');if(!confirm('現在のデータをバックアップ内容で上書きするよ。続ける？'))return;data=incoming;save()}catch{alert('正しいバックアップファイルではありません')}};fr.readAsText(f)}

function ensureMapState(){ if(!data.zoom)data.zoom=1; if(data.panX==null)data.panX=0; if(data.panY==null)data.panY=0; if(data.rotate==null)data.rotate=0; }
function applyMapTransform(){ ensureMapState(); const stage=document.getElementById('panStage'); if(!stage)return; stage.style.transform=`translate(${data.panX}px,${data.panY}px) scale(${data.zoom}) rotate(${data.rotate}deg)`; const sl=document.getElementById('zoomSlider'); if(sl)sl.value=Math.round(data.zoom*100); initMapGestures(); }
function setZoom(z,cx,cy){ ensureMapState(); const old=data.zoom; data.zoom=Math.max(.5,Math.min(3,Number(z)||1)); if(cx!=null&&cy!=null){data.panX=cx-(cx-data.panX)*(data.zoom/old);data.panY=cy-(cy-data.panY)*(data.zoom/old)} localStorage.setItem(LS,JSON.stringify(data)); applyMapTransform(); }
function zoomBy(d){ setZoom((data.zoom||1)+d); }
function rotateMap(){ ensureMapState(); data.rotate=((data.rotate||0)+90)%360; localStorage.setItem(LS,JSON.stringify(data)); applyMapTransform(); }
function fitMap(){ const vp=document.getElementById('mapViewport'), stg=document.getElementById('panStage'); if(!vp||!stg)return; data.zoom=1; data.panX=0; data.panY=0; data.rotate=0; applyMapTransform(); const bw=stg.scrollWidth||1000,bh=stg.scrollHeight||600; const z=Math.max(.5,Math.min(2.2,Math.min((vp.clientWidth-24)/bw,(vp.clientHeight-24)/bh))); data.zoom=z; data.panX=8; data.panY=8; localStorage.setItem(LS,JSON.stringify(data)); applyMapTransform(); }
function toggleFullMap(force){ const vp=document.getElementById('mapViewport'), close=document.getElementById('mapFullClose'); if(!vp)return; const on=force==null?!vp.classList.contains('fullscreenMap'):force; vp.classList.toggle('fullscreenMap',on); if(close)close.classList.toggle('show',on); setTimeout(applyMapTransform,50); }
let mapGestureReady=false;
function initMapGestures(){ const vp=document.getElementById('mapViewport'), stg=document.getElementById('panStage'); if(!vp||!stg||vp.dataset.ready)return; vp.dataset.ready='1'; let dragging=false,lastX=0,lastY=0,lastDist=0;
 vp.addEventListener('wheel',e=>{e.preventDefault(); const rect=vp.getBoundingClientRect(); const dz=e.deltaY>0?-0.08:0.08; setZoom((data.zoom||1)+dz,e.clientX-rect.left,e.clientY-rect.top);},{passive:false});
 vp.addEventListener('pointerdown',e=>{ if(e.target.closest('.unit,.miniRoom,tr,button,input,select,textarea'))return; dragging=true; lastX=e.clientX; lastY=e.clientY; stg.classList.add('dragging'); vp.setPointerCapture(e.pointerId); });
 vp.addEventListener('pointermove',e=>{ if(!dragging)return; data.panX=(data.panX||0)+e.clientX-lastX; data.panY=(data.panY||0)+e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; applyMapTransform(); });
 vp.addEventListener('pointerup',e=>{ dragging=false; stg.classList.remove('dragging'); localStorage.setItem(LS,JSON.stringify(data)); });
 vp.addEventListener('pointercancel',()=>{dragging=false;stg.classList.remove('dragging')});
 vp.addEventListener('touchstart',e=>{ if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }},{passive:false});
 vp.addEventListener('touchmove',e=>{ if(e.touches.length===2){ e.preventDefault(); const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(lastDist){ const rect=vp.getBoundingClientRect(); const cx=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left, cy=(e.touches[0].clientY+e.touches[1].clientY)/2-rect.top; setZoom((data.zoom||1)*(d/lastDist),cx,cy); } lastDist=d; }},{passive:false});
}
function renderMinimap(rooms){let floors=[...new Set(rooms.map(r=>r.floor))].sort((a,b)=>Number(b)-Number(a));return `<div class="minimap">${floors.slice(0,10).map(f=>`<div class="miniFloor">${rooms.filter(r=>r.floor==f).slice(0,12).map(r=>`<span class="miniCell ${r.status}"></span>`).join('')}</div>`).join('')}</div>`}
const _render=render; render=function(){_render();setTimeout(applyMapTransform,0)};

render();
</script></body></html>
